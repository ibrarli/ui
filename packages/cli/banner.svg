    <text x="156" y="381" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">npx apen-ui@latest init</text>
  </g>
  <g transform="translate(760 96)">
    <rect width="424" height="288" rx="36" fill="#131314" stroke="#282a2c"/>
