<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-label="Apen UI by Apen Apps: rounded, dashboard-ready React components">
  <title>Apen UI by Apen Apps</title>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f15a29"/>
      <stop offset="1" stop-color="#00aeef"/>
